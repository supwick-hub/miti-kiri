[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
authors = ["Supriya Wickrematillake <sup@terrific.life>"]
homepage = "https://kiri.terrific.life/"
repository = "https://github.com/supwick-hub/miti-kiri"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rustfft = "6"
kiri-core = { path = "crates/kiri-core" }
miti-kiri = { path = "crates/miti-kiri" }

[profile.release]
opt-level = 3
lto = "thin"
debug = false
